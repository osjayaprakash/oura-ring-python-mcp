name: MCP Registry

# Push a tag like v0.1.0, or run it by hand, to publish server.json to
# registry.modelcontextprotocol.io. The registry checks the PyPI package and
# the ghcr.io image, so this waits for pypi.yml and docker.yml to publish them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login to the registry
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches server.json, or a manual run is on master
        run: |
          version=$(jq -r .version server.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          else
            [ "$GITHUB_REF_NAME" = master ] || { echo "run manual publishes from master"; exit 1; }
          fi
      - name: Wait for the PyPI package and the Docker image
        run: |
          version=$(jq -r .version server.json)
          image=$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)
          for _ in $(seq 60); do
            if curl -sf "https://pypi.org/pypi/oura-ring-python-mcp/$version/json" >/dev/null \
              && docker manifest inspect "$image" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "oura-ring-python-mcp $version or $image not published after 30 minutes"
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
