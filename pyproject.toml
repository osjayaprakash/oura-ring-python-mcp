[project]
name = "oura-ring-mcp"
version = "0.1.0"
description = "MCP server exposing Oura Ring sleep, readiness, activity and heart rate data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "oura", "oura-ring", "sleep", "readiness", "heart-rate", "wearable"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "httpx2>=2.5,<3",
    "mcp>=2.2,<3",
    "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/osjayaprakash/oura-ring-mcp"
Documentation = "https://oura-ring-mcp.readthedocs.io"
Issues = "https://github.com/osjayaprakash/oura-ring-mcp/issues"

[project.optional-dependencies]
langfuse = ["langfuse>=4,<5"]

[project.scripts]
oura-ring-mcp = "oura_ring_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "INSTALL.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/oura_ring_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the real Oura API (needs `oura-ring-mcp auth` first)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
